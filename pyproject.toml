[project]
name = "car-recom-system"
version = "0.1.0"
description = "Conversational used-car search with a grounded sales agent"
readme = "README.md"
requires-python = ">=3.12"

# Runtime only. This is what the deployed app imports, and it is deliberately
# small: torch and transformers are an order of magnitude larger than everything
# here combined and are never loaded by the app. See the pipeline group.
dependencies = [
    "langchain-openai>=1.4.1",
    "langgraph>=1.2.9",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "pyarrow>=18.0.0",
    "python-dotenv>=1.2.2",
    "streamlit>=1.60.0",
]

[project.optional-dependencies]
# Offline dataset build only: downloading the source, running the zero-shot
# tagger, embedding the corpus. Never imported by app.py.
#   uv sync --extra pipeline
pipeline = [
    "kagglehub>=1.0.2",
    "torch>=2.13.0",
    "tqdm>=4.66.0",
    "transformers>=5.14.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
    "python-docx>=1.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
